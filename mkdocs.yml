site:
  name: Formulagate Docs
  site_url: https://docs.formulagate.com
repo_url: https://github.com/username/formulagate
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/username/formulagate
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/formulagate
  version:
    provider: mike

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mike

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference:
    - SDK: api/sdk.md
    - REST API: api/rest.md
    - LangChain: api/langchain.md
    - LlamaIndex: api/llamaindex.md
  - Tutorials:
    - RAG with LangChain: tutorials/rag-langchain.md
    - Formula Verification: tutorials/formula-verification.md
    - Production Deployment: tutorials/production.md
    - Multi-Agent Discovery: tutorials/multi-agent.md
  - Architecture: architecture.md
  - Comparison: comparison.md
  - Pricing: pricing.md
